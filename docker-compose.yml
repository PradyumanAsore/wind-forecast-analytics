services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: uk_wind_backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=UK Wind Generation Forecast Analysis Platform
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      - ELEXON_API_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - DEFAULT_DECISION_CUTOFF_TIME=11:00
      - TIMEZONE=Europe/London
      - ALIGNMENT_METHOD=hourly_block
      - ENABLE_LOCAL_CACHE=true
      - CACHE_DIR=data/cache
      - FIXTURES_DIR=data/fixtures
    volumes:
      - ./data/cache:/app/data/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: uk_wind_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: uk_wind_network
